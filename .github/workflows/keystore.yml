name: Create signing keystore (run once)

on:
  workflow_dispatch:
    inputs:
      alias:
        description: Key alias
        default: sudoku
        required: true
      password:
        description: Password for both the keystore and the key
        required: true
      dname:
        description: Certificate name
        default: CN=Sudoku, O=Debug It Solutions, C=US
        required: true

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore sudoku.jks \
            -alias "${{ inputs.alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ inputs.password }}" \
            -keypass "${{ inputs.password }}" \
            -dname "${{ inputs.dname }}"

      - name: Print the certificate details
        run: |
          keytool -list -v -keystore sudoku.jks \
            -alias "${{ inputs.alias }}" \
            -storepass "${{ inputs.password }}" || true

      - name: Base64 for the repository secret
        run: |
          base64 -w0 sudoku.jks > keystore.base64.txt

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-KEEP-THIS-SAFE
          path: |
            sudoku.jks
            keystore.base64.txt
          retention-days: 1
